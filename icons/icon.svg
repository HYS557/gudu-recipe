<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B47"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#EFE3D5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7B2400" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- 锅体投影与底座 -->
  <g filter="url(#shadow)">
    <!-- 砂锅底部主锅身 -->
    <path d="M120 250 C120 380 392 380 392 250 L120 250 Z" fill="url(#potGrad)"/>
    
    <!-- 锅耳 -->
    <rect x="76" y="240" width="44" height="24" rx="12" fill="#E2D4C3"/>
    <rect x="392" y="240" width="44" height="24" rx="12" fill="#E2D4C3"/>

    <!-- 锅盖 -->
    <path d="M112 240 C140 180 372 180 400 240 Z" fill="#FFFDFB"/>
    <!-- 锅盖提手 -->
    <ellipse cx="256" cy="175" rx="32" ry="16" fill="#D97706"/>
    <ellipse cx="256" cy="170" rx="20" ry="8" fill="#F59E0B"/>
  </g>

  <!-- 蒸腾热气 (咕嘟咕嘟) -->
  <path d="M200 140 Q220 110 200 80 T200 40" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M256 130 Q280 95 256 65 T256 25" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <path d="M312 140 Q330 110 312 80 T312 40" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- 锅身温暖微表情/筷子装饰 -->
  <circle cx="216" cy="285" r="10" fill="#E85D04"/>
  <circle cx="296" cy="285" r="10" fill="#E85D04"/>
  <path d="M236 305 Q256 325 276 305" fill="none" stroke="#E85D04" stroke-width="8" stroke-linecap="round"/>
</svg>
